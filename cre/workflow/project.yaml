# CRE project settings. RPC URLs may use ${VAR} from cre/workflow/.env.
# staging-settings / production-settings: Base Sepolia. fork-settings: a local anvil fork (see ../README.md).
staging-settings:
  rpcs:
    - chain-name: ethereum-testnet-sepolia-base-1
      url: ${BASE_SEPOLIA_RPC}

production-settings:
  rpcs:
    - chain-name: ethereum-testnet-sepolia-base-1
      url: ${BASE_SEPOLIA_RPC}

fork-settings:
  rpcs:
    - chain-name: ethereum-testnet-sepolia-base-1
      url: http://127.0.0.1:8546
